cisco, CA 94103-3561\nUnited States"],"+1 650-903-0800"]],null,null,[[null,"\u003cb\u003eThe internet. As it should be.\u003c/b\u003e\u003cbr\u003e\u003cbr\u003eFirefox is a \u003cb\u003eprivate web browser\u003c/b\u003e designed to protect your data, block trackers and make browsing fast, secure and simple. Whether you’re looking for an incognito browser, a private search experience or a reliable browser for everyday use, Firefox puts you first.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eWhy people choose Firefox\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e• \u003cb\u003eMore privacy, less tracking\u003c/b\u003e – Firefox automatically blocks social media trackers, cross-site cookies, crypto miners and fingerprinting scripts.\u003cbr\u003e• \u003cb\u003ePrivate browsing that protects you\u003c/b\u003e – Open private tabs that don’t save your history, searches or cookies. Lock them with your device security for extra protection.\u003cbr\u003e• \u003cb\u003eFast, smooth performance\u003c/b\u003e – Load pages faster by blocking trackers and reducing unnecessary data usage.\u003cbr\u003e• \u003cb\u003eSearch your way\u003c/b\u003e – Use your preferred private search engine or switch easily from the search bar.\u003cbr\u003e• \u003cb\u003ePasswords made simple\u003c/b\u003e – Generate, store and autofill passwords securely.\u003cbr\u003e• \u003cb\u003eTabs that work for you\u003c/b\u003e – Easily organize and switch between tabs and sync them across devices to pick up where you left off.\u003cbr\u003e• \u003cb\u003eFocus without distractions\u003c/b\u003e – Reader View strips away clutter, while picture-in-picture lets you multitask with videos.\u003cbr\u003e• \u003cb\u003eControl your experience\u003c/b\u003e – Add extensions like ad blockers, customize settings and choose how you browse.\u003cbr\u003e• \u003cb\u003eMake it yours\u003c/b\u003e – Customize your home screen, layout and shortcuts for a more personal browsing experience.\u003cbr\u003e• \u003cb\u003eAI on your terms\u003c/b\u003e – Turn AI completely off or customize it feature by feature.\u003cbr\u003e• \u003cb\u003eQuick page summaries\u003c/b\u003e – Shake your phone to cut through long pages and get the key points.\u003cbr\u003e• \u003cb\u003eSync across devices\u003c/b\u003e – Access your bookmarks, tabs and passwords anywhere you use Firefox.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePrivate by default\u003c/b\u003e\u003cbr\u003eFirefox is built to protect you. \u003cb\u003eEnhanced Tracking Protection\u003c/b\u003e automatically blocks common trackers, while \u003cb\u003eTotal Cookie Protection\u003c/b\u003e keeps cookies isolated to the sites where they belong. When you need more privacy, private browsing mode ensures your history, searches and cookies aren’t saved. Private tabs can also lock automatically, so your activity stays yours.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eYour browser. Your rules.\u003c/b\u003e\u003cbr\u003eFirefox puts you in charge of your internet. Add privacy or productivity \u003cb\u003eextensions\u003c/b\u003e, including ad blockers, move your search bar, choose your default search engine and tailor your browser to how you use the web. Sync your data across devices for a seamless, consistent experience.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eFocus with Firefox. Fast, secure and built around you \u003c/b\u003e\u003cbr\u003eFirefox is designed to help you stay focused with faster, more secure browsing. \u003cb\u003eReader Mode\u003c/b\u003e removes clutter from articles, \u003cb\u003ePicture-in-Picture\u003c/b\u003e keeps videos accessible while you multitask and \u003cb\u003eTracker Blocking\u003c/b\u003e helps pages load faster. Built-in password management and private browsing keep everyday browsing simple and protected.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eBuilt for people, not profit\u003c/b\u003e\u003cbr\u003eFirefox was created in 2004 by Mozilla as a faster, more private and customizable browser designed to put people first. Today, Mozilla remains a nonprofit working to make the internet — and the time you spend on it — better.\u003cbr\u003e\u003cbr\u003eLearn more about Mozilla: https://www.mozilla.org\u003cbr\u003eTerms of Use: https://www.mozilla.org/about/legal/terms/firefox/\u003cbr\u003ePrivacy Policy: https://www.mozilla.org/privacy/firefox\u003cbr\u003eLatest news: https://blog.mozilla.org"]],[[null,"Private by default. Less tracking. Peace of mind built in."]],[null,null,[[["Location",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/4rkEm_eN4F8lAtqf1avrqAQ49_IjMjRduxI5szmftCXmKzSaLsNScjM5DSGQp2qtI5R_fqj8j7aJi_G3dg"]],[[null,"approximate location (network-based)"],[null,"precise location (GPS and network-based)"]],["location_on"]],["Photos/Media/Files",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/pHtIujPWxciAZcfYSwlrGGq14Z984rKLMgcm9RPATLiOlbrWy-tVlelEWgED7gpktgcD1tZizVeHiO5fkw"]],[[null,"read the contents of your USB storage"],[null,"modify or delete the contents of your USB storage"]],["perm_media"]],["Storage",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/aWNKQedLTpw6u6yyMjQObmuoKu67A1czWnIcvID86oAmMT02r5mNdRn6l9ZN2t2MIyH6tNy-01v7ukeQ"]],[[null,"read the contents of your USB storage"],[null,"modify or delete the contents of your USB storage"]],["storage"]],["Camera",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/xbP_oGuJ21iG29iVh0p-UIZPzi_fYj8PMYiqDd9-LvaZ_a1tRcwp0I2-arfXvgX9YtfZTTaqwcLRWPNQM_c"]],[[null,"take pictures and videos"]],["camera"]],["Microphone",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/daUjqbSOr2QpaqXS2HQbNzYzzqN2yWGzM_7AZxwFaWLT7_kIhX95HKi_HSpjeeQDOmFMENZxJqblbu_4qg"]],[[null,"record audio"]],["perm_camera_mic"]]],[["Other",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/pkKXoPl5q7n8T0s7KREtdvUZn1PLRgx-Ox0t4tkO8af4JpgGbyAxLBTsvEKKBCjwBACQsZisSYNmHPGbBA"]],[[null,"view network connections"],[null,"full network access"],[null,"change your audio settings"],[null,"run at
