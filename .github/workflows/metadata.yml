name: Refresh Play metadata

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library-writes
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - id: refresh
        run: python -m wystore_library.metadata --config apps.json --output library
      - name: Commit changed public metadata
        if: ${{ !cancelled() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure') }}
        run: |
          git config user.name wyrtensi
          git config user.email wyrtensi@gmail.com
          git add library
          if ! git diff --cached --quiet; then
            git commit -m "Refresh application descriptions, artwork and release notes from Google Play."
            git push origin HEAD:main
          fi
