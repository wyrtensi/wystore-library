name: Verify library tooling

on:
  push:
    paths-ignore: ['library/**']
  pull_request:
    paths-ignore: ['library/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "from pathlib import Path; from wystore_library.sync import read_config; print('Configured APK sets:', len(read_config(Path('apps.json'))))"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: library
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Exmeaning/playfetch
          ref: 8bf14e52133d9609ad91ff830252414716d79017
          path: backend
          persist-credentials: false
      - name: Apply certificate metadata compatibility patch
        run: |
          git apply --check ../library/patches/playfetch-certificate-sets.patch
          git apply ../library/patches/playfetch-certificate-sets.patch
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
      - run: go test ./...
      - run: go build -trimpath -o playfetch ./cmd/playfetch
      - run: ./playfetch version
