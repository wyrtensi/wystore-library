name: Validate Play device coverage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-writes
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: library
          persist-credentials: false
      - name: Initialize failure report
        run: |
          printf '%s\n' '{"schema":1,"published":false,"complete":false,"records":[],"status":"setup_error"}' > "$RUNNER_TEMP/coverage-report.json"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: library/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: library
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Exmeaning/playfetch
          ref: 8bf14e52133d9609ad91ff830252414716d79017
          path: backend
          persist-credentials: false
      - name: Apply pinned backend patches
        working-directory: backend
        run: |
          git apply --check ../library/patches/playfetch-certificate-sets.patch
          git apply ../library/patches/playfetch-certificate-sets.patch
          git apply --check ../library/patches/playfetch-pinned-version.patch
          git apply ../library/patches/playfetch-pinned-version.patch
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build pinned backend
        working-directory: backend
        run: |
          go build -trimpath -o "$RUNNER_TEMP/playfetch" ./cmd/playfetch
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Locate APK verification tools
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/apksigner"
          test -x "$tools/aapt2"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Read current published certificates after acquiring the library lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/library/index.json?ref=main" --jq .content > "$RUNNER_TEMP/index.base64"
          base64 --decode "$RUNNER_TEMP/index.base64" > "$RUNNER_TEMP/current-index.json"
      - name: Validate all profiles in this batch
        working-directory: library
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_AAS_TOKEN: ${{ secrets.GOOGLE_AAS_TOKEN }}
          BATCH: ${{ matrix.batch }}
        run: python -m wystore_library.coverage_validation --index "$RUNNER_TEMP/current-index.json" --batch-index "$BATCH" --batch-count 8 --report "$RUNNER_TEMP/coverage-report.json"
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-coverage-batch-${{ matrix.batch }}
          path: ${{ runner.temp }}/coverage-report.json
          if-no-files-found: warn
          retention-days: 14
